<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found · Xiao Wang</title>
  <script>
    // GitHub Pages serves this file for every missing path. Old URLs (printed as
    // QR codes on posters, linked from LinkedIn / papers) are forwarded to their
    // new locations here, so the old root pages and files/ PDFs can stay deleted.
    // Keys are lowercase, without ".html" and without a trailing slash.
    var MOVED = {
      "/mistypilot":       "/projects/mistypilot/",
      "/automisty":        "/projects/automisty/",
      "/interventionlens": "/projects/interventionlens/",
      "/misty":            "/projects/misty-therapy/",
      "/files/phd_resume_xiaowang.pdf":          "/resume/Phd_Resume_XiaoWang.pdf",
      "/files/mistypilot_eccv2026.pdf":          "/projects/mistypilot/files/MistyPilot_ECCV2026.pdf",
      "/files/mistypilot_eccv2026_slides.pdf":   "/projects/mistypilot/files/MistyPilot_ECCV2026_Slides.pdf",
      "/files/mistypilot_eccv2026_poster.pdf":   "/projects/mistypilot/files/MistyPilot_ECCV2026_Poster.pdf",
      "/files/automisty_poster.pdf":             "/projects/automisty/files/AutoMisty_Poster.pdf"
    };
    var key = location.pathname.toLowerCase().replace(/\/+$/, "").replace(/\.html$/, "");
    var target = MOVED[key];
    if (target) location.replace(target + location.search + location.hash);
  </script>
